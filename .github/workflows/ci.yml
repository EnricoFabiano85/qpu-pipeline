name: Quantum Engine CI

on:
  push:
    branches: [ "main", "feat/*", "infra/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
   
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Run in Dev Container
        uses: devcontainers/ci@v0.3
        with:
          imageName: quantum-engine-dev
          cacheFrom: quantum-engine-dev
          push: never
          runCmd: |
            python3 -m pip install pytest-github-actions-annotate-failures
            cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j $(nproc)
            pytest -v tests/tests.py --benchmark-columns=min,max,mean,stddev

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error title=Build/Test Failed::Quantum Engine CI pipeline failed. Check logs."
