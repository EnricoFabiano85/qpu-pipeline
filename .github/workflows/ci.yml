name: Quantum Engine CI

on:
  push:
    branches: [ "main", "feat/*", "infra/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
   
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Run in Dev Container
        uses: devcontainers/ci@v0.3
        with:
          imageName: quantum-engine-dev
          cacheFrom: quantum-engine-dev
          push: never
          runCmd: |
            python3 -m pip install -e .[test] --no-build-isolation
            pytest tests/ -v --benchmark-skip
            pytest tests/ --benchmark-only --benchmark-columns=mean,stddev,rounds

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error title=Build/Test Failed::Quantum Engine CI pipeline failed. Check logs."
